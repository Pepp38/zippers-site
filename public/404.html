<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zippers</title>
  </head>
  <body>
    <script>
      (function () {
        var pathSegmentsToKeep = 0; // 0 = custom domain root, 1 = /repo on github.io
        var l = window.location;
        var segments = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var base = segments.endsWith('/') ? segments : segments + '/';
        var path = l.pathname + l.search + l.hash;
        l.replace(l.origin + base + '?p=' + encodeURIComponent(path.replace(base.replace(/\/$/, ''), '')));
      })();
    </script>
  </body>
</html>
