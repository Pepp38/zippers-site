<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Savior | Automatic Form Draft Recovery</title>
    <meta
      name="description"
      content="Savior is a tiny, dependency-free autosave engine for HTML forms. It restores drafts after refresh, navigation, or crashes."
    />

    <meta property="og:title" content="Savior | Automatic Form Draft Recovery" />
    <meta
      property="og:description"
      content="A tiny, dependency-free autosave engine for HTML forms. Restore drafts after refresh, navigation, tab close, or crashes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // GH Pages SPA fallback.
      // If we were redirected from /404.html to /?p=<originalPath>, restore the route.
      (function () {
        var url = new URL(window.location.href);
        var p = url.searchParams.get('p');
        if (!p) return;

        // Decode and restore the original path.
        var restored = decodeURIComponent(p);
        window.history.replaceState(null, '', restored);

        // Clean the query param so the URL stays canonical.
        url.searchParams.delete('p');
        window.history.replaceState(null, '', url.pathname + url.search + url.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
